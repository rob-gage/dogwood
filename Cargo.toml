# Copyright Rob Gage 2026

[workspace]
members = ["cli",
    "template_materials",
    "template_project",
    "editor",
    "engine",
    "engine_audio",
    "engine_compute",
    "engine_graphics",
    "engine_input",
    "engine_physics",
    "engine_user_interface",
]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
version = "0.0.1"
license = "AGPL-3.0-only"
edition = "2024"
repository = "https://github.com/rob-gage/dogwood"
description = "Dogwood Game Engine"

[workspace.dependencies]
bevy_ecs = { version = "=0.19.1" }
cargo_metadata = "=0.19.2"
clap = { version = "=4.6.6", features = ["derive"] }
dogwood_editor = { version = "=0.0.1", path = "editor" }
dogwood_engine = { version = "=0.0.1", path = "engine" }
dogwood_engine_audio = { version = "=0.0.1", path = "engine_audio" }
dogwood_engine_compute = { version = "=0.0.1", path = "engine_compute" }
dogwood_engine_graphics = { version = "=0.0.1", path = "engine_graphics" }
dogwood_engine_input = { version = "=0.0.1", path = "engine_input" }
dogwood_engine_physics = { version = "=0.0.1", path = "engine_physics" }
dogwood_engine_user_interface = { version = "=0.0.1", path = "engine_user_interface" }
dogwood_template_materials = { version = "=0.0.1", path = "template_materials" }
egui = "=0.36.1"
egui-wgpu = { version = "=0.36.1", default-features = false, features = ["winit"] }
egui-winit = { version = "=0.36.1", default-features = false }
naga_oil = "=0.23.0"
pollster = "=0.4.0"
rapier2d = { version = "=0.35.3", features = ["parallel"] }
tracing = { version = "=0.1.44", features = ["release_max_level_off"] }
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
libloading = "=0.8.9"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
# Backend features are supplied by engine_compute per target. Keeping them out
# of this shared dependency prevents unrelated crates from selecting OpenGL.
wgpu = { version = "=30.0.0", default-features = false, features = ["naga-ir"] }
winit = { version = "=0.30.13", default-features = false }
