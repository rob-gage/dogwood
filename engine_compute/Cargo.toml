[package]
name = "dogwood_engine_compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
naga_oil = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows prefers Vulkan and retains DirectX 12 as the fallback. The
# application selects DXC explicitly for the fallback; FXC cannot compile
# some WGSL atomics.
wgpu = { workspace = true, features = ["dx12", "vulkan"] }
windows-sys = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
# Keep the existing Linux/macOS-friendly native backends out of Windows builds.
wgpu = { workspace = true, features = ["vulkan", "gles"] }
libloading = { workspace = true }

[dev-dependencies]
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
