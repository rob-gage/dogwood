# Copyright Rob Gage 2026

[package]
name = "dogwood_engine_compute"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
naga_oil = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows builds use only the native DirectX 12 backend.
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(not(windows))'.dependencies]
# Keep the existing Linux/macOS-friendly native backends out of Windows builds.
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[dev-dependencies]
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
