[package]
name = "cli"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "dogwood"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
home = "0.5"
include_dir = "0.7"
semver = "1"
serde_json = "1"
which = "8"
engine_resources = { path = "../engine_resources" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out", "msl-out"] }

[dev-dependencies]
tempfile = "3"
